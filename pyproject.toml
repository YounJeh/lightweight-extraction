[project]
name = "lightweight-extraction"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "YounJeh", email = "84447956+YounJeh@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dspy>=3.3.1",
    "langextract[openai]>=1.6.0",
    "langfuse>=4.14.5",
    "modal>=1.5.5",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pymupdf4llm>=1.28.2",
    "python-fasthtml>=0.14.11",
    "rapidocr>=3.9.2",
]

[tool.uv]
package = false
# rapidocr dépend en dur de opencv-python (variante GUI, a besoin de
# libGL/libxcb absents d'un environnement serveur) ; on veut
# opencv-python-headless (déclarée ci-dessus). Faire coexister les deux et
# parier sur l'ordre d'installation pour que headless gagne s'est avéré peu
# fiable (cassé sur le buildpack Cloud Run, et sur `uv run` en local à
# chaque resynchronisation — voir choix_techniques.md, section OCR).
# override-dependencies avec un marqueur toujours faux fait que
# opencv-python n'est jamais résolu du tout, quel que soit ce que rapidocr
# demande — plus de pari sur un ordre d'installation.
override-dependencies = ["opencv-python; python_version<'0'"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live: appelle un vrai LLM (Gemini) via LangExtract, nécessite GOOGLE_GENERATIVE_AI_API_KEY dans l'environnement",
]
