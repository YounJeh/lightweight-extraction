[project]
name = "lightweight-extraction"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "YounJeh", email = "84447956+YounJeh@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langextract[openai]>=1.6.0",
    "pydantic>=2.13.4",
    "pymupdf4llm>=1.28.2",
    "python-fasthtml>=0.14.11",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live: appelle un vrai LLM (Gemini) via LangExtract, nécessite GOOGLE_GENERATIVE_AI_API_KEY dans l'environnement",
]
